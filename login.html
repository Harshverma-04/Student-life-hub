<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Life Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#3b82f6', 600: '#2563eb' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 p-8">
        <div class="text-center mb-8">
            <div class="inline-flex bg-brand-600 text-white p-3 rounded-2xl text-2xl mb-3 shadow-md">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1 class="text-2xl font-bold" data-en="Welcome to Student Life Hub" data-hi="स्टूडेंट लाइफ हब में आपका स्वागत है">Welcome to Student Life Hub</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" data-en="Login or create your free student account" data-hi="लॉगिन करें या अपना फ्री स्टूडेंट अकाउंट बनाएं">Login or create your free student account</p>
        </div>

        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1" data-en="Email Address" data-hi="ईमेल आईडी">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="student@example.com">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1" data-en="Password" data-hi="पासवर्ड">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-lg transition" data-en="Continue to Dashboard" data-hi="डैशबोर्ड पर आगे बढ़ें">Continue to Dashboard</button>
        </form>

        <div class="mt-6 text-center text-sm">
            <a href="index.html" class="text-brand-600 dark:text-blue-400 hover:underline font-medium" data-en="← Back to Home" data-hi="← होम पेज पर वापस जाएं">← Back to Home</a>
        </div>
    </div>
    <script src="assets/js/app.js"></script>
    <script>
        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Demo Authentication Successful! Redirecting to Dashboard.");
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
